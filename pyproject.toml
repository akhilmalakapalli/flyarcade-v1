[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flyarcade-v1"
version = "0.1.0"
description = "CPU-first connectome-constrained spiking arcade benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
connectome = ["neuprint-python==0.6.3"]
report = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
